name: CI/CD Pipeline Completo (Ventas + Despachos + Frontend)

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push - API Ventas
        uses: docker/build-push-action@v4
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-ventas:latest

      - name: Build and Push - API Despachos
        uses: docker/build-push-action@v4
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-despachos:latest

      - name: Build and Push - Frontend React
        uses: docker/build-push-action@v4
        with:
          context: ./front_despacho
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/app-frontend:latest

  deploy-to-aws-eks:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
            aws-region: us-east-1

      - name: Actualizar contexto de Kubernetes (EKS)
        run: aws eks update-kubeconfig --name inovatech-eks --region us-east-1

      - name: Desplegar infraestructura en Kubernetes
        run: |
          kubectl apply -f k8s/00-secrets.yaml
          kubectl apply -f k8s/01-mysql.yaml
          kubectl apply -f k8s/02-ventas.yaml
          kubectl apply -f k8s/03-despachos.yaml
          kubectl apply -f k8s/04-frontend.yaml
          kubectl apply -f k8s/05-hpa.yaml

      - name: Reiniciar Pods para aplicar cambios
        run: |
          kubectl rollout restart deployment ventas-deployment
          kubectl rollout restart deployment api-despachos
          kubectl rollout restart deployment app-frontend