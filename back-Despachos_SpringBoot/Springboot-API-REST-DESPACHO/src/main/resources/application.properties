spring.application.name=Springboot-API-REST-DESPACHO
server.port=8081
spring.web.allow-cors=true

# Conexión limpia al DNS interno de Kubernetes
spring.datasource.url=jdbc:mysql://mysql-service:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.platform=mysql

spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html